[project]
name = "anchor-air"
version = "0.1.0"
description = "Python SDK for Anchor Air"
readme = "readme.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anchor_air"]