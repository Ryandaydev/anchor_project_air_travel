[project]
name = "air-travel"
version = "0.2.0"
description = "Python SDK for the Air Travel API"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_travel"]