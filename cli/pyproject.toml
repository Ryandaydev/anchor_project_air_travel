[project]
name = "air-travel-cli"
version = "0.1.0"
description = "Command line interface for the Air Travel API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "air-travel",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
air-travel = "air_travel_cli.main:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_travel_cli"]

[tool.uv.sources]
air-travel = { path = "../sdk", editable = true }
